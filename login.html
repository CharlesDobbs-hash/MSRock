<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Log In / Sign Up - MandS Rock</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://use.typekit.net/puc1zbw.css">
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js"></script>
    </head>

    <body class="d-flex flex-column min-vh-100">

        <!-- HEADER -->
        <header>
            <div class="container-fluid">
                <div class="row align-items-center text-center">
                    <div class="col-3">
                        <img src="Logo%20w%20background%20no%20o%20but%20use.png" alt="M&amp;S Rock logo" class="logo" />
                    </div>
                    <div class="col-5">
                        <div class="site-name">MS Rock</div>
                        <div class="tagline">Unique Products for Unique People</div>
                    </div>
                    <div class="col-2 nav-text">
                        <a href="login.html" class="font-weight-bold">Log in/Sign Up</a>
                    </div>
                    <div class="col-2">
                        <a href="cart.html"><img src="shopping-cart-o.png" alt="Shopping cart" class="cart" /></a>
                    </div>
                </div>

                <nav class="d-flex justify-content-around nav-text pb-1">
                    <a href="index.html">Home</a>
                    <a href="About%20Us.html">About Us</a>
                    <a href="AboutOurProducts.html">About Our Products</a>
                    <a href="contact.html">Contact Us</a>
                </nav>
            </div>
        </header>

        <!-- BODY -->
        <main class="flex-grow-1 d-flex flex-column">
            <div class="container-fluid flex-grow-1 d-flex flex-column">
                <div class="row flex-grow-1">

                    <!-- Left side: returning customers log in -->
                    <div class="col-md-6 club-form club-divider py-3">
                        <h2 class="club-heading">Log In</h2>

                        <form id="loginForm" action="#" method="POST">
                            <label for="loginEmail" class="sr-only">Email Address</label>
                            <input type="email" id="loginEmail" name="email" class="form-control" placeholder="Email Address" autocomplete="email" required />

                            <label for="loginPassword" class="sr-only">Password</label>
                            <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Password" autocomplete="current-password" required />

                            <img src="theclub.png" alt="The Quarry Rock Club" class="club-picture" />

                            <button type="submit" class="btn club-button">Submit</button>
                        </form>
                    </div>

                    <!-- Right side: new customers create an account -->
                    <div class="col-md-6 club-form py-3">
                        <h2 class="club-heading">Not a member of our rock club?</h2>
                        <p class="club-subheading">It&rsquo;s free and easy to sign up!</p>

                        <form id="signupForm" action="welcome.html">
                            <label for="signupName" class="sr-only">Your Name</label>
                            <input type="text" id="signupName" name="name" class="form-control" placeholder="Your Name" autocomplete="name" required />

                            <label for="signupEmail" class="sr-only">Email Address</label>
                            <input type="email" id="signupEmail" name="email" class="form-control" placeholder="Email Address" autocomplete="email" required />

                            <label for="signupAddress" class="sr-only">Mailing Address</label>
                            <input type="text" id="signupAddress" name="address" class="form-control" placeholder="Mailing Address" autocomplete="street-address" required />

                            <label for="newPassword" class="sr-only">Password</label>
                            <input type="password" id="newPassword" name="new-password" class="form-control" placeholder="Password" autocomplete="new-password" minlength="8" required />

                            <label for="repeatPassword" class="sr-only">Repeat Password</label>
                            <input type="password" id="repeatPassword" name="repeat-password" class="form-control" placeholder="Repeat Password" autocomplete="new-password" required />

                            <button type="submit" class="btn club-button">Submit</button>
                        </form>
                    </div>

                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer>
            <div class="container-fluid py-2">
                <div class="row align-items-center">
                    <div class="col-md-4 nav-text">
                        PO Box 116<br />
                        Circleville, UT 84723<br />
                        <a href="mailto:msrockut@gmail.com">msrockut@gmail.com</a>
                    </div>
                    <div class="col-md-4 text-center">Copyright 2026</div>
                    <div class="col-md-4 text-md-right social-icons">
                        <a href="#" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
                        <a href="#" aria-label="Facebook" class="ml-2"><i class="bi bi-facebook"></i></a>
                        <a href="#" aria-label="TikTok" class="ml-2"><i class="bi bi-tiktok"></i></a>
                    </div>
                </div>
            </div>
        </footer>

        <script>
            // ----- Sign-up form -----
            var signupForm = document.getElementById("signupForm");
            var newPassword = document.getElementById("newPassword");
            var repeatPassword = document.getElementById("repeatPassword");

            // Checks that the two passwords match
            function checkPasswords() {
                if (repeatPassword.value !== newPassword.value) {
                    repeatPassword.setCustomValidity("The passwords do not match.");
                } else {
                    repeatPassword.setCustomValidity("");
                }
            }
            newPassword.addEventListener("input", checkPasswords);
            repeatPassword.addEventListener("input", checkPasswords);

            // When every box is filled in correctly and Submit is clicked, go to the welcome page.
            // (No account is created yet. That needs an account system, which we will add later.)
            signupForm.addEventListener("submit", function (event) {
                event.preventDefault();
                window.location.href = "welcome.html";
            });

            // ----- Log in form -----
            // Not connected to an account system yet, so Submit does nothing for now.
            document.getElementById("loginForm").addEventListener("submit", function (event) {
                event.preventDefault();
            });
        </script>

    </body>
</html>
