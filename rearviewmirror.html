        <script>
            // The cart is remembered in the visitor's browser under this name.
            // cart.html will read the same name later.
            var CART_KEY = "msrockCart";

            var zoomPicture = document.getElementById("zoomPicture");
            var addButton = document.getElementById("addToCart");
            var chosen = null; // the picture button that was clicked

            // Reads the cart from the browser (an empty list if there is nothing yet)
            function getCart() {
                try {
                    return JSON.parse(localStorage.getItem(CART_KEY)) || [];
                } catch (error) {
                    return [];
                }
            }

            // Saves the cart in the browser
            function saveCart(cart) {
                try {
                    localStorage.setItem(CART_KEY, JSON.stringify(cart));
                } catch (error) {
                    // Saving is blocked in this browser, so the cart can't be remembered
                }
            }

            // True if this product is already in the cart
            function inCart(id) {
                return getCart().some(function (item) {
                    return item.id === id;
                });
            }

            // Turns a picture gray and makes it unclickable (the gray look is in styles.css)
            function grayOut(button) {
                button.disabled = true;
            }

            // Gray out what is in the cart and un-gray what was removed from it.
            // Runs when the page opens and again when the visitor comes back with the Back button.
            function refreshPictures() {
                document.querySelectorAll(".product-picture-button").forEach(function (button) {
                    button.disabled = inCart(button.dataset.id);
                });
            }
            refreshPictures();
            window.addEventListener("pageshow", refreshPictures);

            // When a picture is clicked, show it enlarged
            $("#productModal").on("show.bs.modal", function (event) {
                chosen = event.relatedTarget;
                zoomPicture.src = chosen.dataset.image;
                zoomPicture.alt = chosen.dataset.name;
            });

            // "Add to cart" button: save the product, gray out the picture, close the enlarged view
            addButton.addEventListener("click", function () {
                if (!inCart(chosen.dataset.id)) {
                    var cart = getCart();
                    cart.push({
                        id: chosen.dataset.id,
                        name: chosen.dataset.name,
                        price: Number(chosen.dataset.price),
                        image: chosen.dataset.image
                    });
                    saveCart(cart);
                }
                grayOut(chosen);
                $("#productModal").modal("hide");
            });
        </script>
